name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore full source from archive parts
        run: |
          set -e
          cat ci/source_part_*.b64 > /tmp/src.b64
          base64 -d /tmp/src.b64 > /tmp/src.tar.gz
          tar xzf /tmp/src.tar.gz -C .
          if [ -f keystore/ostadkar-release.keystore.b64 ]; then
            base64 -d keystore/ostadkar-release.keystore.b64 > keystore/ostadkar-release.keystore
          fi
          echo "Files:" && find . -type f | head -100
          ls -la keystore/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OstadKar-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
