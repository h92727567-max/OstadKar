name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode keystore
        run: |
          mkdir -p keystore
          if [ -f keystore/ostadkar-release.keystore.b64 ]; then
            base64 -d keystore/ostadkar-release.keystore.b64 > keystore/ostadkar-release.keystore
          fi
          ls -la keystore/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OstadKar-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
